<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DinkHub</title>
  <!--
    Where DinkHub sends you after a payment. Master copy lives in the DinkHub repo
    at docs/payment-return.html and is published to this site byte for byte, so
    edit it there rather than here. The reasoning behind it, including why it does
    not tell you whether the payment succeeded, is in lib/paymentLinks.ts.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #222222;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #f2f2f2; }
      .card { background: #1e1e1e; }
      .muted { color: #a8a8a8; }
    }
    .card {
      max-width: 420px; width: 100%; background: #f7f7f7;
      border-radius: 14px; padding: 28px; text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 12px; }
    .muted { color: #6b6b6b; font-size: 14px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You can close this tab</h1>
    <p>Head back to DinkHub to see your membership.</p>
    <p class="muted">
      If you have just paid, it can take a few seconds to appear. Open the Membership
      tab and pull down to refresh.
    </p>
  </div>
</body>
</html>
