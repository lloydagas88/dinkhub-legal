<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DinkHub - Email confirmed</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 560px; margin: 0 auto; padding: 56px 24px 64px; line-height: 1.6;
      color: #222; background: #fff; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { color: #e6e6e6; background: #111; } }
    .tick {
      width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 50%;
      background: #E9F5EC; color: #2E7D32; font-size: 40px; line-height: 72px;
    }
    @media (prefers-color-scheme: dark) { .tick { background: #16301b; } }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { font-size: 17px; margin: 0 0 16px; }
    .muted { color: #666; font-size: 15px; margin-top: 32px; }
    @media (prefers-color-scheme: dark) { .muted { color: #9a9a9a; } }
    a { color: #1976D2; }
  </style>
</head>
<body>
  <div class="tick">&#10003;</div>
  <h1>Your email is confirmed</h1>
  <p>Thanks for verifying your email address.</p>
  <p><strong>You can close this page and open the DinkHub app to log in.</strong></p>
  <p class="muted">
    Having trouble? Email
    <a href="mailto:dinkhubappsupport@gmail.com">dinkhubappsupport@gmail.com</a>
    and we will sort it out.
  </p>
</body>
</html>
